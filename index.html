<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleria Map Generator · A Guide for Heroes (Who'd Rather Not Be)</title>
<meta name="description" content="Interactive, client-side fantasy map generator for Aleria / Kremantin from A Guide for Heroes (Who'd Rather Not Be).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23161b22' stroke='%23d6b25e' stroke-width='4'/%3E%3Cpath d='M32 10l6 18 18 4-18 4-6 18-6-18-18-4 18-4z' fill='%23d6b25e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/d3-delaunay.min.js"></script>
<script src="vendor/jspdf.umd.min.js" defer></script>
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="sigil">✦</span><div><b>Aleria Map Generator</b><small>A Guide for Heroes (Who'd Rather Not Be)</small></div></div>
  <div class="actions">
    <button id="btnNew" class="primary" data-tip="Generate a new map with a random seed (Shift+G)">⟳ New map</button>
    <label class="inline" data-tip="Map style preset (Style tab has fine controls)">Style <select id="styleSelect"></select></label>
    <span class="sep"></span>
    <button id="btnUndo" data-tip="Undo (Ctrl+Z)" disabled>↶</button>
    <button id="btnRedo" data-tip="Redo (Ctrl+Y / Ctrl+Shift+Z)" disabled>↷</button>
    <span class="sep"></span>
    <button id="btnSave" data-tip="Save project as JSON (Ctrl+S)">Save</button>
    <button id="btnLoad" data-tip="Open a saved .json project (Ctrl+O)">Open</button>
    <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    <button id="btnExport" data-tip="Export PNG (up to 8K), SVG or PDF (Ctrl+E)">Export</button>
    <button id="btnShare" data-tip="Shareable link & embed code">Share</button>
    <button id="btnHelp" data-tip="Help & keyboard shortcuts (?)">?</button>
    <button id="btnPanel" class="only-narrow" data-tip="Show/hide side panel">☰</button>
  </div>
</header>

<main id="layout">
  <aside id="left">
    <div id="tools" class="tools"></div>
    <div id="toolOptions" class="panel-body"></div>
  </aside>

  <section id="viewport">
    <canvas id="map" tabindex="0" aria-label="Map canvas"></canvas>
    <div id="zoomCtl">
      <button id="zoomIn" data-tip="Zoom in (+)">+</button>
      <button id="zoomOut" data-tip="Zoom out (−)">−</button>
      <button id="zoomFit" data-tip="Fit map (0)">⤢</button>
    </div>
    <div id="minimapWrap" data-tip="Minimap: click or drag to navigate (M to toggle)"><canvas id="minimap"></canvas></div>
    <div id="mapTip" class="maptip" hidden></div>
    <div id="toast" hidden></div>
    <div id="loading">Forging Kremantin…</div>
  </section>

  <aside id="right">
    <nav class="tabs" id="tabs">
      <button data-tab="inspector" class="active" data-tip="Selected feature details & lore notes">Inspector</button>
      <button data-tab="layers" data-tip="Layers, overlays and legends">Layers</button>
      <button data-tab="style" data-tip="Colours, textures, effects">Style</button>
      <button data-tab="assets" data-tip="Stamp & icon library, custom uploads">Assets</button>
      <button data-tab="world" data-tip="Generation settings (seed, size, climate, lore mode)">World</button>
    </nav>
    <div class="tabpanel active" id="tab-inspector"></div>
    <div class="tabpanel" id="tab-layers"></div>
    <div class="tabpanel" id="tab-style"></div>
    <div class="tabpanel" id="tab-assets"></div>
    <div class="tabpanel" id="tab-world"></div>
  </aside>
</main>

<footer id="status">
  <span id="stTool"></span>
  <span id="stMsg" class="grow"></span>
  <span id="stCell"></span>
  <span id="stCoords"></span>
  <span id="stZoom"></span>
  <span id="stSeed"></span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-card"><button class="close" id="modalClose" aria-label="Close">×</button><div id="modalBody"></div></div>
</div>
<div id="uiTip" class="uitip" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
